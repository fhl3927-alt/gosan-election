<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>고산교회 항존직 피택선거 - 입력 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Noto+Serif+KR:wght@600;700;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col justify-between p-3 sm:p-6">

  <header class="bg-slate-900 border-2 border-amber-500/30 rounded-2xl px-6 py-4 mb-6 shadow-xl flex items-center justify-between">
    <div class="flex items-center space-x-4">
      <div class="w-12 h-12 rounded-2xl bg-amber-500/20 border border-amber-500/50 flex items-center justify-center text-amber-400">
        <svg class="w-7 h-7 fill-current" viewBox="0 0 24 24"><path d="M11 2h2v6h5v2h-5v12h-2V10H6V8h5V2z"/></svg>
      </div>
      <div>
        <h1 class="font-serif text-2xl font-black text-amber-200">고산교회 항존직 피택선거</h1>
        <p class="text-sm text-slate-300">관리자 입력 시스템 (실시간 클라우드 싱크)</p>
      </div>
    </div>
    <div class="flex items-center space-x-3">
      <a href="display.html" target="_blank" class="px-5 py-3 bg-gradient-to-r from-amber-600 to-yellow-500 hover:from-amber-500 hover:to-yellow-400 text-slate-950 text-base font-extrabold rounded-xl shadow-lg flex items-center gap-2 transition-all">
        <i data-lucide="external-link" class="w-5 h-5"></i>
        <span>16:9 송출 화면 열기</span>
      </a>
      <button onclick="showResetDialog()" class="px-4 py-3 text-sm text-red-400 hover:text-red-300 border-2 border-red-500/40 rounded-xl flex items-center gap-2 bg-red-950/30 font-bold">
        <i data-lucide="trash-2" class="w-5 h-5"></i>
        <span>모두 초기화</span>
      </button>
    </div>
  </header>

  <main class="flex-grow w-full max-w-7xl mx-auto space-y-6">
    
    <div class="bg-slate-900/90 border border-amber-500/40 rounded-xl px-4 py-2.5 flex items-center justify-between shadow-md max-w-xl">
      <div class="flex items-center space-x-2.5">
        <div class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></div>
        <span class="text-xs font-bold text-amber-300">네트워크 분리 환경 실시간 싱크 활성</span>
      </div>
      <span class="text-[11px] text-emerald-400 font-mono font-bold">ACTIVE SYNC</span>
    </div>

    <!-- 1단계 기본 정보 -->
    <div class="bg-slate-900/90 border-2 border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
      <div class="flex items-center space-x-3 pb-4 border-b border-slate-800 mb-6">
        <span class="w-8 h-8 rounded-lg bg-amber-500/20 text-amber-400 text-base font-black flex items-center justify-center font-mono">1</span>
        <h2 class="font-serif text-xl font-bold text-amber-100">선거 기본정보 설정 (직분 선택 시 기준표 자동계산)</h2>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
        <div>
          <label class="block text-sm font-bold text-slate-300 mb-2">소속 교회명</label>
          <input type="text" id="adminChurchName" value="고산교회" class="w-full bg-slate-950 border-2 border-slate-700 rounded-2xl px-4 py-3.5 text-lg text-slate-100 font-bold focus:border-amber-500 focus:outline-none" oninput="handleStateUpdate()">
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-300 mb-2">선출 직분 (타이틀)</label>
          <div class="flex space-x-2">
            <select id="officeSelect" onchange="changeOffice(this.value)" class="w-1/2 bg-slate-950 border-2 border-slate-700 rounded-2xl px-3 py-3.5 text-base text-slate-200 font-bold focus:border-amber-500 focus:outline-none">
              <option value="장로">장로 (2/3)</option>
              <option value="안수집사">안수집사 (1/2)</option>
              <option value="권사">권사 (1/2)</option>
              <option value="custom">직접입력</option>
            </select>
            <input type="text" id="adminOfficeTitle" value="장로" class="w-1/2 bg-slate-950 border-2 border-slate-700 rounded-2xl px-3 py-3.5 text-base text-amber-300 font-black focus:border-amber-500 focus:outline-none" oninput="handleStateUpdate()">
          </div>
        </div>
        <div>
          <label class="block text-sm font-bold text-slate-300 mb-2">선거 공식 명칭</label>
          <input type="text" id="adminElectionTitle" value="항존직 피택선거" class="w-full bg-slate-950 border-2 border-slate-700 rounded-2xl px-4 py-3.5 text-lg text-amber-200 font-bold focus:border-amber-500 focus:outline-none" oninput="handleStateUpdate()">
        </div>
        <div>
          <label class="block text-sm font-bold text-amber-400 mb-2">총 투표자(투표수)</label>
          <input type="text" inputmode="numeric" pattern="[0-9]*" id="adminTotalBallots" placeholder="숫자 입력" class="w-full bg-slate-950 border-2 border-sky-500/50 rounded-2xl px-4 py-3.5 text-xl text-white font-mono font-black focus:border-sky-400 focus:outline-none" oninput="handleTotalBallotsInput(this.value)">
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-6 pt-6 border-t border-slate-800 items-center">
        <div>
          <label class="block text-sm font-bold text-amber-400 mb-2">피택 확정 기준 득표수</label>
          <div class="flex items-center space-x-3">
            <input type="text" inputmode="numeric" pattern="[0-9]*" id="adminThreshold" placeholder="기준표" class="w-full bg-slate-950 border-2 border-amber-500/60 rounded-2xl px-4 py-3.5 text-xl text-amber-300 font-mono font-black focus:border-amber-400 focus:outline-none" oninput="handleStateUpdate()">
            <span class="text-base font-bold text-slate-400 whitespace-nowrap">표 이상</span>
          </div>
        </div>
        <div class="flex items-center justify-start md:justify-end pt-4 md:pt-0">
          <label class="inline-flex items-center cursor-pointer bg-slate-950 border-2 border-slate-800 px-6 py-3.5 rounded-2xl">
            <input type="checkbox" id="adminAutoConfirm" checked onchange="handleStateUpdate()" class="sr-only peer">
            <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[4px] after:left-[4px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-amber-600 relative"></div>
            <span class="ml-3 text-base font-bold text-slate-200">기준표 도달 시 자동 '확정' 처리</span>
          </label>
        </div>
      </div>
    </div>

    <!-- 2단계 후보자 입력 -->
    <div class="bg-slate-900/90 border-2 border-slate-800 rounded-3xl p-6 sm:p-8 shadow-2xl">
      <div class="flex items-center justify-between pb-4 border-b border-slate-800 mb-6">
        <div class="flex items-center space-x-3">
          <span class="w-8 h-8 rounded-lg bg-amber-500/20 text-amber-400 text-base font-black flex items-center justify-center font-mono">2</span>
          <h2 class="font-serif text-xl font-bold text-amber-100">후보자 성명 및 득표수 입력 (최대 10명)</h2>
        </div>
        <span class="text-sm font-bold text-slate-400">좌측 5명 / 우측 5명</span>
      </div>

      <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="space-y-4">
          <div class="text-sm font-bold text-amber-400 px-1">기호 1 ~ 5 번 (좌측 열)</div>
          <div id="adminSlotsLeft" class="space-y-4"></div>
        </div>
        <div class="space-y-4">
          <div class="text-sm font-bold text-amber-400 px-1">기호 6 ~ 10 번 (우측 열)</div>
          <div id="adminSlotsRight" class="space-y-4"></div>
        </div>
      </div>
    </div>
  </main>

  <div id="confirmResetModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-900 border-2 border-slate-700 rounded-3xl max-w-md w-full p-8 text-center shadow-2xl">
      <h3 class="font-serif text-2xl font-bold text-white mb-3">모든 데이터를 초기화할까요?</h3>
      <p class="text-base text-slate-300 mb-6">입력된 모든 이름과 득표수가 백지로 재설정됩니다.</p>
      <div class="flex justify-center space-x-4">
        <button onclick="hideResetDialog()" class="px-6 py-3 bg-slate-800 text-slate-200 rounded-xl text-base font-bold">취소</button>
        <button onclick="executeFullReset()" class="px-6 py-3 bg-red-600 hover:bg-red-500 text-white rounded-xl text-base font-bold shadow">초기화 실행</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'GOSAN_CHURCH_ELECTION_DATA_V7';
    const SYNC_CHANNEL = 'gosan_election_channel_v7';

    let bc = null;
    try { bc = new BroadcastChannel(SYNC_CHANNEL); } catch(e) {}

    function getCleanState() {
      return {
        churchName: '고산교회',
        electionTitle: '항존직 피택선거',
        officeTitle: '장로',
        thresholdVotes: '',
        totalBallots: '',
        autoConfirm: true,
        candidates: Array.from({ length: 10 }, (_, i) => ({ id: i + 1, name: '', votes: '', manualConfirmed: null }))
      };
    }

    let appState = loadState();

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return JSON.parse(saved);
      } catch (e) {}
      return getCleanState();
    }

    function saveAndBroadcast() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
        if (bc) bc.postMessage({ type: 'SYNC', payload: appState });
      } catch (e) {}
    }

    window.addEventListener('DOMContentLoaded', () => {
      syncAdminInputs();
      renderAdminCandidateSlots();
      lucide.createIcons();
    });

    function syncAdminInputs() {
      document.getElementById('adminChurchName').value = appState.churchName || '고산교회';
      document.getElementById('adminElectionTitle').value = appState.electionTitle || '항존직 피택선거';
      document.getElementById('adminOfficeTitle').value = appState.officeTitle || '장로';
      document.getElementById('adminThreshold').value = appState.thresholdVotes || '';
      document.getElementById('adminTotalBallots').value = appState.totalBallots || '';
      document.getElementById('adminAutoConfirm').checked = !!appState.autoConfirm;

      const sel = document.getElementById('officeSelect');
      if (['장로', '안수집사', '권사'].includes(appState.officeTitle)) {
        sel.value = appState.officeTitle;
      } else {
        sel.value = 'custom';
      }
    }

    function changeOffice(val) {
      const officeInput = document.getElementById('adminOfficeTitle');
      if (val !== 'custom') {
        officeInput.value = val;
      } else {
        officeInput.value = '';
        officeInput.focus();
      }
      calculateThreshold();
      handleStateUpdate();
    }

    function handleTotalBallotsInput(val) {
      const cleaned = val.replace(/[^0-9]/g, '');
      appState.totalBallots = cleaned;
      calculateThreshold();
      handleStateUpdate();
    }

    function calculateThreshold() {
      const total = parseInt(appState.totalBallots, 10);
      const office = appState.officeTitle;
      if (!isNaN(total) && total > 0) {
        let calc = 0;
        if (office === '장로') {
          calc = Math.ceil(total * (2 / 3));
        } else if (office === '안수집사' || office === '권사') {
          calc = Math.floor(total / 2) + 1;
        }
        if (calc > 0) {
          appState.thresholdVotes = calc;
          document.getElementById('adminThreshold').value = calc;
        }
      }
    }

    function handleStateUpdate() {
      appState.churchName = document.getElementById('adminChurchName').value.trim();
      appState.electionTitle = document.getElementById('adminElectionTitle').value.trim();
      appState.officeTitle = document.getElementById('adminOfficeTitle').value.trim();
      appState.thresholdVotes = document.getElementById('adminThreshold').value;
      appState.totalBallots = document.getElementById('adminTotalBallots').value;
      appState.autoConfirm = document.getElementById('adminAutoConfirm').checked;

      saveAndBroadcast();
    }

    function renderAdminCandidateSlots() {
      const leftCol = document.getElementById('adminSlotsLeft');
      const rightCol = document.getElementById('adminSlotsRight');
      leftCol.innerHTML = '';
      rightCol.innerHTML = '';

      appState.candidates.forEach((cand, idx) => {
        const slotEl = document.createElement('div');
        const isConfirmed = isCandidateConfirmed(cand);
        
        slotEl.className = `p-4 rounded-2xl border-2 transition-all ${
          cand.name.trim() 
            ? (isConfirmed ? 'bg-amber-950/30 border-amber-500/60' : 'bg-slate-950/80 border-slate-800') 
            : 'bg-slate-950/40 border-slate-900 border-dashed'
        }`;

        slotEl.innerHTML = `
          <div class="flex items-center gap-3">
            <span class="w-10 h-10 rounded-xl bg-slate-800 text-slate-200 text-base font-mono font-black flex items-center justify-center flex-shrink-0">
              ${cand.id}
            </span>
            <input 
              type="text" 
              placeholder="후보자 성명" 
              value="${escapeHtml(cand.name)}" 
              oninput="handleCandidateName(${idx}, this.value)"
              class="w-40 sm:w-48 bg-slate-900 border-2 border-slate-700 rounded-xl px-4 py-3 text-xl font-bold text-slate-100 placeholder-slate-600 focus:outline-none focus:border-amber-500"
            />
            
            <div class="flex items-center bg-slate-900 border-2 border-slate-700 rounded-xl overflow-hidden flex-1 max-w-[180px]">
              <input 
                type="text" 
                inputmode="numeric" 
                pattern="[0-9]*" 
                placeholder="0"
                value="${cand.votes !== '' ? cand.votes : ''}" 
                oninput="handleCandidateVotes(${idx}, this.value)"
                class="w-full bg-transparent px-3 py-3 text-2xl font-mono font-black text-amber-300 text-right focus:outline-none"
              />
              <span class="pr-3 text-sm font-bold text-slate-400">표</span>
            </div>

            <div class="flex flex-col space-y-1 flex-shrink-0">
              <button type="button" onclick="adjustVotes(${idx}, 1)" class="w-9 h-7 bg-slate-800 hover:bg-slate-700 text-amber-300 rounded-t-lg flex items-center justify-center text-sm font-bold border border-slate-700">▲</button>
              <button type="button" onclick="adjustVotes(${idx}, -1)" class="w-9 h-7 bg-slate-800 hover:bg-slate-700 text-amber-300 rounded-b-lg flex items-center justify-center text-sm font-bold border border-slate-700">▼</button>
            </div>

            <button 
              type="button" 
              onclick="toggleManualConfirm(${idx})" 
              class="px-4 py-3 rounded-xl text-sm font-bold border-2 flex items-center gap-2 transition-all flex-shrink-0 ${
                isConfirmed 
                  ? 'bg-amber-500 text-slate-950 font-black border-amber-300 shadow-lg' 
                  : 'bg-slate-800 hover:bg-slate-700 text-slate-300 border-slate-700'
              }">
              <i data-lucide="${isConfirmed ? 'check-circle-2' : 'circle'}" class="w-5 h-5"></i>
              <span>확정</span>
            </button>
          </div>
        `;

        if (idx < 5) leftCol.appendChild(slotEl);
        else rightCol.appendChild(slotEl);
      });
      lucide.createIcons();
    }

    function isCandidateConfirmed(cand) {
      if (!cand.name || !cand.name.trim()) return false;
      if (cand.manualConfirmed !== null) return cand.manualConfirmed;
      const numVotes = parseInt(cand.votes, 10) || 0;
      const threshold = parseInt(appState.thresholdVotes, 10);
      if (appState.autoConfirm && !isNaN(threshold) && threshold > 0) {
        return numVotes >= threshold;
      }
      return false;
    }

    function handleCandidateName(idx, val) {
      appState.candidates[idx].name = val;
      saveAndBroadcast();
    }

    function handleCandidateVotes(idx, val) {
      const cleaned = val.replace(/[^0-9]/g, '');
      appState.candidates[idx].votes = cleaned === '' ? '' : parseInt(cleaned, 10);
      saveAndBroadcast();
    }

    function adjustVotes(idx, amount) {
      const current = parseInt(appState.candidates[idx].votes, 10) || 0;
      const next = Math.max(0, current + amount);
      appState.candidates[idx].votes = next;
      saveAndBroadcast();
      renderAdminCandidateSlots();
    }

    function toggleManualConfirm(idx) {
      const cand = appState.candidates[idx];
      cand.manualConfirmed = !isCandidateConfirmed(cand);
      saveAndBroadcast();
      renderAdminCandidateSlots();
    }

    function showResetDialog() { document.getElementById('confirmResetModal').classList.remove('hidden'); }
    function hideResetDialog() { document.getElementById('confirmResetModal').classList.add('hidden'); }
    function executeFullReset() {
      localStorage.removeItem(STORAGE_KEY);
      appState = getCleanState();
      saveAndBroadcast();
      syncAdminInputs();
      renderAdminCandidateSlots();
      hideResetDialog();
      lucide.createIcons();
    }
    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
